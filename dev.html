<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-8S/SZLywku0U/RrYqsyJipglbQDmDYKUhYh2EhDUBts='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://abeqdmurddrkrqbnfylb.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helpdesk Survivors</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1c2c">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Helpdesk">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="overlay"></div>
  <div id="debug" style="display:none"></div>
  <div id="boot">Loading…</div>
  <script>
    // Shows load errors on the page instead of a blank screen (main.js removes #boot once running).
    addEventListener('error', (e) => {
      const b = document.getElementById('boot');
      if (b) b.textContent = 'The game failed to load: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown error');
    }, true);
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
