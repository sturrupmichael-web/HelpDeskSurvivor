/* Helpdesk Survivors UI. Colors follow data/palette.js. */
:root {
  --ink: #1a1c2c;
  --paper: #f4f4f4;
  --gray: #94b0c2;
  --slate: #333c57;
  --blue: #41a6f6;
  --navy: #29366f;
  --yellow: #ffcd75;
  --red: #b13e53;
  --green: #38b764;
  --font: ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--font); }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
kbd { font-family: var(--font); font-size: 0.8em; padding: 1px 5px; border: 1px solid var(--gray); border-bottom-width: 2px; border-radius: 3px; color: var(--gray); }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
.hud-xp { position: absolute; top: 0; left: 0; right: 0; height: 14px; }
.hud-xp svg { width: 100%; height: 14px; display: block; border-bottom: 2px solid var(--ink); }
.hud-level { position: absolute; right: 8px; top: 0; font-size: 12px; font-weight: bold; line-height: 14px; }
.hud-timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
.hud-timer .t { font-size: 30px; font-weight: bold; display: block; }
.hud-timer small { color: var(--gray); font-size: 10px; letter-spacing: 1px; }
.hud-left { position: absolute; top: 22px; left: 12px; }
.hud-sanity { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: bold; }
.hud-sanity svg { width: 160px; height: 12px; border: 2px solid var(--ink); }
.hud-sanity .label { color: var(--red); }
.slots { display: flex; gap: 4px; margin-top: 6px; }
.slot { width: 32px; height: 38px; background: rgba(26, 28, 44, 0.75); border: 2px solid var(--slate); display: flex; flex-direction: column; align-items: center; padding-top: 2px; }
.slot.empty { opacity: 0.5; }
.slot .pips { font-size: 5px; letter-spacing: -1px; color: var(--yellow); line-height: 8px; }
.hud-right { position: absolute; top: 22px; right: 12px; text-align: right; font-size: 13px; font-weight: bold; line-height: 1.6; }
.hud-right b { color: var(--yellow); font-size: 16px; }
.hud-right .mult { color: var(--green); }

[hidden] { display: none !important; }
.hud-banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: linear-gradient(90deg, transparent, rgba(177, 62, 83, 0.85) 20%, rgba(177, 62, 83, 0.85) 80%, transparent); }
.hud-banner b { font-size: 30px; letter-spacing: 3px; color: var(--yellow); }
.hud-banner span { font-size: 14px; color: var(--paper); }
.hud-banner.show { animation: banner-in 0.35s ease-out, banner-blink 0.5s steps(2) 0.35s 4; }
@keyframes banner-in { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes banner-blink { 50% { opacity: 0.6; } }
@media (prefers-reduced-motion: reduce) { .hud-banner.show { animation: none; } }

/* Overlays */
#overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(26, 28, 44, 0.72); padding: 16px; }
.panel { background: var(--slate); border: 4px solid var(--ink); box-shadow: 0 0 0 2px var(--gray), 8px 8px 0 rgba(0,0,0,0.4); padding: 24px 28px; text-align: center; max-width: 420px; width: 100%; max-height: 100%; overflow: auto; }
.panel.wide { max-width: 880px; }
.panel h1 { font-size: 40px; line-height: 1; margin: 0 0 12px; color: var(--yellow); text-shadow: 3px 3px 0 var(--ink); letter-spacing: 2px; }
.panel h2 { font-size: 28px; margin: 0 0 8px; color: var(--blue); text-shadow: 2px 2px 0 var(--ink); }
.panel.lose h1 { color: var(--red); }
.panel.win h1 { color: var(--green); }
.sub { color: var(--gray); margin: 0 0 18px; font-size: 14px; }
.tiny { color: var(--gray); font-size: 10px; margin: 14px 0 0; opacity: 0.7; }
.panel button { display: block; width: 100%; margin: 8px 0; padding: 10px; font: bold 15px var(--font); color: var(--paper); background: var(--navy); border: 3px solid var(--ink); cursor: pointer; }
.panel button:hover, .panel button:focus-visible { background: #3b5dc9; outline: none; }
.panel button.primary { background: #3b5dc9; }
.panel button.primary:hover { background: var(--blue); color: var(--ink); }
.controls { margin-top: 16px; font-size: 12px; color: var(--gray); line-height: 2; }
.cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.panel button.card { width: 250px; text-align: left; padding: 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; background: var(--ink); border-color: var(--gray); }
.panel button.card:hover, .panel button.card:focus-visible { border-color: var(--yellow); background: #222640; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head > div { flex: 1; }
.card-name { font-size: 14px; color: var(--paper); }
.card-level { font-size: 12px; color: var(--yellow); }
.card-text { font-size: 13px; font-weight: normal; color: var(--paper); }
.card-flavor { font-size: 12px; font-weight: normal; font-style: italic; color: var(--gray); }
.stats { margin: 0 auto 16px; border-collapse: collapse; font-size: 14px; text-align: left; }
.stats td { padding: 3px 10px; }
.stats td:first-child { white-space: nowrap; }
.stats td:last-child { color: var(--yellow); text-align: right; }

/* Debug */
#debug { position: fixed; left: 12px; bottom: 12px; background: rgba(26, 28, 44, 0.85); border: 2px solid var(--green); padding: 8px 10px; font-size: 11px; line-height: 1.6; color: var(--green); pointer-events: none; }
#debug kbd { color: var(--green); border-color: var(--green); }

@media (max-width: 600px) {
  .hud-sanity svg { width: 90px; }
  .hud-timer .t { font-size: 22px; }
  .panel h1 { font-size: 30px; }
}

/* Milestone 3: boss bar, overtime, evolved slots, chest screen */
.hud-timer small.over { color: var(--red); font-weight: bold; animation: banner-blink 1s steps(2) infinite; }
.hud-right .muted { color: var(--gray); font-size: 11px; }
.hud-boss { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: min(560px, 80vw); text-align: center; }
.hud-boss .boss-name { font-size: 13px; font-weight: bold; color: var(--yellow); margin-bottom: 4px; letter-spacing: 1px; }
.hud-boss svg { width: 100%; height: 12px; display: block; border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--gray); }
.slot.evolved { border-color: var(--yellow); box-shadow: 0 0 6px rgba(255, 205, 117, 0.6); }
.slot.evolved .pips { font-size: 7px; letter-spacing: 0; font-weight: bold; }
.card-hint { font-size: 11px; font-weight: normal; color: var(--yellow); border-top: 1px dashed var(--slate); padding-top: 6px; }
.panel.chest { max-width: 520px; }
.panel.chest h2 { color: var(--yellow); }
.panel.chest .card-text, .panel.chest .card-flavor { margin: 6px 0; text-align: center; }
.panel button:disabled { opacity: 0.5; cursor: default; }
.evolve { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 8px 0 14px; }
.evolve > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.evo-from { opacity: 0.7; }
.evo-to b { color: var(--yellow); font-size: 15px; }
.evo-to .icon { filter: drop-shadow(0 0 6px var(--yellow)); }
.evo-arrow { color: var(--yellow); font-size: 22px; }
.chest-list { display: flex; flex-direction: column; gap: 8px; margin: 0 auto 14px; max-width: 320px; text-align: left; }
.chest-item { display: flex; align-items: center; gap: 12px; background: var(--ink); border: 2px solid var(--gray); padding: 6px 10px; }
@media (prefers-reduced-motion: reduce) { .hud-timer small.over { animation: none; } }
.panel button.always { max-width: 420px; margin: 16px auto 0; font-size: 13px; }

/* Milestone 4: title, characters, shop, summary */
.pay { color: var(--green); font-weight: bold; }
.ok { color: var(--green); }
.record { color: var(--yellow); font-size: 10px; letter-spacing: 1px; margin-left: 6px; animation: banner-blink 0.8s steps(2) infinite; }
.panel.title { max-width: 460px; }
.title-char { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 0 0 12px; text-align: left; }
.title-char canvas, .card canvas { image-rendering: pixelated; width: 64px; height: 64px; flex: none; }
.records { margin: 14px auto 0; font-size: 12px; }
.panel.chars { max-width: 1000px; }
.panel button.char { width: 220px; }
.panel button.char .card-name { flex: 1; }
.panel button.char.selected { border-color: var(--green); }
.panel button.char.locked canvas { filter: brightness(0.25); }
.panel button.char:disabled { opacity: 0.55; }
.char-status { font-size: 12px; text-align: center; padding-top: 6px; border-top: 1px dashed var(--slate); }
.panel button.back { max-width: 240px; margin: 16px auto 0; }
.shop-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 8px; text-align: left; }
.panel button.shop-row { display: flex; align-items: center; gap: 12px; margin: 0; padding: 8px 10px; background: var(--ink); border-color: var(--gray); text-align: left; font-weight: normal; }
.panel button.shop-row:hover:not(:disabled) { border-color: var(--yellow); background: #222640; }
.panel button.shop-row:disabled { opacity: 0.6; cursor: default; }
.shop-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.shop-info .pips { color: var(--yellow); font-size: 9px; letter-spacing: -1px; margin-left: 4px; }
.shop-cost { font-size: 14px; white-space: nowrap; }
.summary-cols { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; text-align: left; }
.summary .stats { margin: 0; }
.stats tr.paid td { border-top: 1px dashed var(--gray); padding-top: 6px; }
.tools { min-width: 300px; flex: 1; max-width: 400px; display: flex; flex-direction: column; gap: 6px; }
.tools-head { font-size: 12px; color: var(--gray); letter-spacing: 1px; }
.tool-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.tool-row.evolved .tool-name { color: var(--yellow); }
.tool-name { width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-bar { flex: 1; height: 8px; background: var(--ink); }
.tool-bar i { display: block; height: 100%; background: var(--blue); }
.tool-dmg { width: 64px; text-align: right; color: var(--yellow); }
.summary-buttons { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.summary-buttons button { flex: 1; min-width: 150px; }
@media (prefers-reduced-motion: reduce) { .record { animation: none; } }

/* Polish pass: touch, gamepad focus, settings, stats, achievements */
html, body, #game { touch-action: none; -webkit-user-select: none; user-select: none; }
.hud-pause { display: none; position: absolute; top: 64px; left: 50%; transform: translateX(-50%); pointer-events: auto; width: 40px; height: 32px; font: bold 14px var(--font); color: var(--paper); background: rgba(26, 28, 44, 0.75); border: 2px solid var(--gray); }
@media (pointer: coarse) { .hud-pause { display: block; } }
.panel button:focus, .panel input:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
.toasts { position: fixed; top: 96px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 20; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--ink); border: 2px solid var(--yellow); box-shadow: 4px 4px 0 rgba(0,0,0,0.4); animation: toast-in 0.3s ease-out; transition: opacity 0.5s, transform 0.5s; }
.toast small { display: block; font-size: 9px; letter-spacing: 1px; color: var(--yellow); }
.toast b { font-size: 13px; }
.toast.out { opacity: 0; transform: translateX(30px); }
@keyframes toast-in { from { transform: translateX(60px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; transition: none; } }
.settings { display: flex; flex-direction: column; gap: 12px; margin: 8px 0 4px; text-align: left; }
.setting { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.setting label { flex: 1; }
.setting input[type=range] { width: 160px; accent-color: var(--yellow); }
.setting .val { width: 40px; text-align: right; color: var(--yellow); }
.panel button.toggle { width: 90px; margin: 0; padding: 6px; }
.panel button.toggle.on { background: var(--green); color: var(--ink); }
.panel.stats-page { max-width: 760px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; text-align: left; font-size: 12px; margin: 10px 0; }
.stat-grid div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--slate); padding: 2px 0; }
.stat-grid b { color: var(--yellow); }
.section-head { font-size: 12px; color: var(--gray); letter-spacing: 1px; text-align: left; margin-top: 12px; }
.tool-dps { width: 64px; text-align: right; color: var(--gray); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; text-align: left; }
.ach { display: flex; gap: 10px; align-items: center; padding: 8px; background: var(--ink); border: 2px solid var(--yellow); }
.ach.locked { border-color: var(--slate); opacity: 0.55; }
.ach.locked .icon { filter: grayscale(1) brightness(0.6); }
.ach b { font-size: 13px; display: block; }
.ach span { font-size: 11px; color: var(--gray); }
@media (max-width: 600px) {
  .panel { padding: 16px 12px; }
  .panel button.card, .panel button.char { width: 100%; }
  .shop-list { grid-template-columns: 1fr; }
  .setting input[type=range] { width: 110px; }
  .hud-right { font-size: 11px; }
  .slot { width: 26px; height: 32px; }
}
.row-buttons { display: flex; gap: 8px; }
.row-buttons button { flex: 1; }

/* Phones: timer on top, pause beside it, HUD blocks below so nothing overlaps. */
@media (max-width: 600px) {
  .hud-timer { top: 16px; }
  .hud-timer small { font-size: 8px; }
  .hud-left { top: 62px; left: 8px; }
  .hud-right { top: 62px; right: 8px; font-size: 10px; line-height: 1.5; }
  .hud-right b { font-size: 13px; }
  .hud-sanity .label { display: none; }
  .hud-sanity { font-size: 10px; }
  .slots { gap: 2px; margin-top: 4px; }
  .slot { width: 26px; height: 32px; }
  .slot svg { width: 18px; height: 18px; }
  .hud-pause { top: 20px; left: 12px; transform: none; }
  .toasts { top: 150px; right: 8px; }
}

#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; color: var(--gray); }

/* Office maps */
.panel button.card.map { width: 212px; }
.panel button.card.map canvas { width: 72px; height: 72px; image-rendering: pixelated; border: 2px solid var(--ink); flex: none; }
.panel button.card.map.selected { border-color: var(--green); }
.panel button.card.map.locked canvas { filter: grayscale(1) brightness(0.4); }
.panel button.card.map:disabled { opacity: 0.6; }
.unlock { color: var(--yellow); font-size: 14px; margin: 0 0 14px; animation: banner-blink 0.8s steps(2) 4; }
@media (max-width: 600px) { .panel button.card.map { width: 100%; } }

/* Online leaderboard */
.board .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
.panel .board .tabs button.tab, .panel.board .tabs button.tab { width: auto; flex: 1 1 150px; margin: 0; padding: 8px; font-size: 13px; }
.panel button.tab.selected { background: var(--ink); border-color: var(--yellow); color: var(--yellow); }
.board-body { min-height: 120px; }
.board-table { width: 100%; max-width: 640px; }
.board-table tr.head td { color: var(--gray); border-bottom: 1px dashed var(--gray); }
.board-table td { color: var(--paper); text-align: left; }
.board-table td:first-child, .board-table td:last-child { text-align: right; color: var(--yellow); }
.board-table tr.me td { color: var(--blue); }
.board-msg { color: var(--gray); font-size: 13px; }
.board-note { color: var(--gray); font-size: 12px; margin: 10px 0 0; }
.board-post { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.board-post input { font: bold 15px var(--font); padding: 9px 10px; width: 200px; color: var(--paper); background: var(--ink); border: 3px solid var(--gray); }
.board-post input:focus { outline: none; border-color: var(--yellow); }
.panel .board-post button { width: auto; margin: 0; }
.board-post .board-msg { flex-basis: 100%; text-align: center; }
.board-table td { white-space: nowrap; }
.board-table td:nth-child(2) { white-space: normal; word-break: break-word; }
@media (max-width: 600px) {
  .board-table { font-size: 12px; }
  .board-table td { padding: 3px 4px; }
  .board-table td:nth-child(3) { display: none; }
}

/* Level-up: 4 cards in one row on wide screens. */
.panel .cards.levelup { gap: 10px; }
.panel .cards.levelup button.card { width: 190px; }
@media (max-width: 600px) { .panel .cards.levelup button.card { width: 100%; } }
/* Short landscape phones: drop the flavor line so all four cards fit. */
@media (max-height: 500px) {
  .panel .cards.levelup .card-flavor { display: none; }
  .panel .cards.levelup button.card { width: calc(25% - 8px); min-width: 150px; padding: 8px; gap: 4px; }
  .panel .cards.levelup .card-text, .panel .cards.levelup .card-hint { font-size: 11px; }
}

/* Help Desk Wiki */
.wiki-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; text-align: left; margin-top: 6px; }
.wiki-entry { display: flex; gap: 10px; align-items: flex-start; padding: 8px; background: var(--ink); border: 2px solid var(--gray); }
.wiki-entry.evolved { border-color: var(--yellow); }
.wiki-entry.locked { border-color: var(--slate); opacity: 0.6; }
.wiki-entry.locked .icon { filter: brightness(0) invert(0.25); }
.wiki-entry .icon, .wiki-thumb { flex: none; }
.wiki-entry b { font-size: 13px; display: block; margin-bottom: 2px; }
.wiki-entry i { font-size: 11px; display: block; color: var(--paper); opacity: 0.8; margin-bottom: 4px; }
.wiki-entry span { font-size: 11px; display: block; color: var(--gray); }
.wiki-entry .wiki-facts { color: var(--yellow); margin-top: 3px; }
.wiki-new { color: var(--paper); font-size: 13px; margin: 0 0 10px; }
.wiki-new b { color: var(--yellow); }
@media (max-width: 600px) { .wiki-grid { grid-template-columns: 1fr; } }

/* HR performance review on the end-of-shift screen */
.review { max-width: 724px; margin: 16px auto 0; padding: 12px 16px; background: var(--paper); color: var(--ink); text-align: left; font-size: 13px; border-left: 6px solid var(--gray); box-shadow: 4px 4px 0 var(--slate); }
.review-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: 1px; color: var(--slate); border-bottom: 1px solid var(--gray); padding-bottom: 4px; }
.review-rating { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0; font-size: 16px; }
.review-stars { color: #d9a03f; font-size: 18px; letter-spacing: 2px; }
.review-label { font-size: 11px; letter-spacing: 1px; color: var(--slate); text-transform: uppercase; font-weight: bold; }
.review ul { margin: 4px 0 8px; padding-left: 18px; }
.review li { margin: 3px 0; line-height: 1.35; }
.review-goal { line-height: 1.35; }
.review-sign { margin-top: 8px; text-align: right; color: var(--slate); }
.review.rating-eotm { border-left-color: var(--yellow); }
.review.rating-exceeds, .review.rating-meets { border-left-color: var(--green); }
.review.rating-needs { border-left-color: var(--blue); }
.review.rating-pip { border-left-color: var(--red); }
.review.rating-pip .review-rating b { color: var(--red); }

/* Account screen and the "which progress do you keep?" choice */
.panel.account { max-width: 520px; }
.panel.account p { line-height: 1.4; }
.panel button.google { margin-top: 8px; }
.sync-line { color: var(--gray); font-size: 13px; }
.name-row { display: flex; gap: 8px; margin-top: 12px; }
.name-row .board-name { flex: 1; min-width: 0; }
.name-row button { margin: 0; width: auto; }
.save-picks { display: flex; gap: 12px; flex-wrap: wrap; }
.panel button.save-pick { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; text-align: left; font-weight: normal; }
.posting-as { font-size: 14px; }
.name-row input { font: bold 15px var(--font); padding: 9px 10px; color: var(--paper); background: var(--ink); border: 3px solid var(--gray); }
.name-row input:focus { outline: none; border-color: var(--yellow); }
.sign-in-error { color: var(--yellow); font-size: 13px; }

/* Player profiles and the version line */
.panel button.name-link { all: unset; cursor: pointer; color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; word-break: break-word; }
.panel button.name-link:hover, .panel button.name-link:focus-visible { color: var(--yellow); outline: none; }
.profile-top { display: flex; gap: 24px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; text-align: left; }
.profile-top .stats { margin: 0; }
.profile-best { width: 100%; max-width: 520px; margin: 0 auto; }
.profile-best tr.head td { color: var(--gray); border-bottom: 1px dashed var(--gray); }
.profile-best td { text-align: right; white-space: nowrap; }
.profile-best td:first-child { text-align: left; color: var(--paper); white-space: normal; }
.profile-ach { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.profile-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 12px; background: var(--ink); border: 1px solid var(--slate); }
.version { margin: 8px 0 0; font-size: 10px; color: var(--gray); opacity: 0.7; letter-spacing: 1px; }

/* What's new */
.panel.news { max-width: 640px; text-align: left; }
.panel.news h2, .panel.news .sub { text-align: center; }
.news-entry { margin: 10px 0 14px; }
.news-title { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; color: var(--yellow); }
.news-title span { color: var(--gray); font-size: 12px; }
.news-entry ul { margin: 6px 0 0; padding-left: 20px; }
.news-entry li { margin: 4px 0; line-height: 1.4; font-size: 14px; }
.version .name-link { font-size: inherit; letter-spacing: inherit; }

/* Report a Bug */
.panel.bug { max-width: 520px; }
.panel.bug p { line-height: 1.4; }
.bug-text { box-sizing: border-box; width: 100%; resize: vertical; font: 15px/1.4 var(--font); padding: 9px 10px; color: var(--paper); background: var(--ink); border: 3px solid var(--gray); }
.bug-text:focus { outline: none; border-color: var(--yellow); }
.bug-count { text-align: right; margin-top: 2px; }

/* Preview builds (node build.mjs --preview) */
.preview-banner { margin: 0 0 8px; padding: 6px 10px; font-weight: bold; color: var(--ink); background: var(--yellow); text-align: center; }

/* Training shift coach card (src/game/tutorial.js) */
.hud-coach { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 24px)); padding: 10px 14px 12px; background: rgba(26, 28, 44, 0.9); border: 2px solid var(--green); box-shadow: 4px 4px 0 rgba(0,0,0,0.4); text-align: center; display: flex; flex-direction: column; gap: 4px; }
.hud-coach small { font-size: 10px; letter-spacing: 1px; color: var(--green); }
.hud-coach b { font-size: 16px; letter-spacing: 1px; color: var(--yellow); }
.hud-coach span { font-size: 13px; line-height: 1.4; color: var(--paper); }
.hud-coach svg { width: 100%; height: 6px; display: block; margin-top: 4px; border: 1px solid var(--ink); }
.hud-coach.show { animation: coach-in 0.3s ease-out; }
@keyframes coach-in { from { transform: translate(-50%, 20px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hud-coach.show { animation: none; } }
@media (max-width: 600px) { .hud-coach { bottom: 10px; padding: 8px 10px 10px; } .hud-coach b { font-size: 14px; } .hud-coach span { font-size: 12px; } }
.levelup-tip { max-width: 560px; margin: 0 auto 12px; padding: 8px 12px; font-size: 13px; border: 2px solid var(--green); background: rgba(26, 28, 44, 0.6); }
.levelup-tip b { color: var(--green); }
.panel.training .training-list { text-align: left; margin: 8px 0 12px; padding-left: 20px; font-size: 14px; line-height: 1.5; }

/* Clock In picker: tech, then map, then confirm. The bar stays on screen while the cards scroll. */
.setup-step { color: var(--yellow); font-size: 11px; letter-spacing: 2px; margin: 0 0 4px; }
.panel.setup { padding-bottom: 0; }
.panel.setup .cards { margin-bottom: 14px; }
.panel button.setup-tech { display: inline-flex; width: auto; align-items: center; gap: 10px; margin: 0 auto 14px; padding: 6px 14px 6px 6px; text-align: left; background: var(--ink); border-color: var(--green); }
.setup-tech canvas { image-rendering: pixelated; width: 40px; height: 40px; }
.setup-tech b { display: block; font-size: 14px; }
.setup-tech small { color: var(--yellow); font-size: 11px; font-weight: normal; }
.setup-bar { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 10px 0 14px; margin: 0 -4px; background: var(--slate); border-top: 2px solid var(--ink); }
.setup-bar button { margin: 0; flex: 1; min-height: 48px; }
.setup-bar button.primary { flex: 2; }
@media (max-width: 600px) {
  /* Two compact tech cards per row so the whole roster fits on a phone. */
  .panel.setup .cards { gap: 8px; }
  .panel.setup button.card.char { width: calc(50% - 4px); padding: 8px; gap: 4px; }
  .panel.setup button.char .card-head { flex-direction: column; gap: 4px; text-align: center; }
  .panel.setup button.char .card-head kbd { display: none; }
  .panel.setup button.char .card-name { font-size: 13px; }
  .panel.setup button.char .card-level { font-size: 11px; text-align: center; }
  .panel.setup button.char .card-text { font-size: 11px; }
  .panel.setup button.card.map { padding: 8px; gap: 4px; }
  .panel.setup .card-text { font-size: 12px; }
  .setup-bar kbd { display: none; }
}
</style>

oks the same.","Damage numbers and pickup labels use a crisp pixel font that matches the art.","Menus, level-up cards and the pause screen no longer redraw the office 60 times a second while you read them.","Merger Day no longer stutters when the parent company takes over more of the floor.","Your save now has a version number, so future updates can rename or rework things without losing your progress."]},{id:"2026-10-21-clockin",date:"Oct 21, 2026",title:"Pick your tech and map when you Clock In",items:["Clock In now walks you through it: pick your technician, then your map, then confirm. No more backing out of menus to switch.","Your last tech and map are picked for you, so a repeat shift is still just two taps (or Enter, Enter, Enter).","Locked techs and maps show what unlocks them, and you can hire a tech right from the picker.","The end-of-shift screen has a new Change Tech or Map button."]},{id:"2026-10-21-merger",date:"Oct 21, 2026",title:"New map: Merger Day, unlocks and a rebalance",items:["Congratulations, you've been acquired! Win the Night Shift in the Parking Garage to unlock Merger Day (1.5x Overtime Pay).","The new parent company's navy-and-gold floor spreads every minute. Users who start on it are tougher, but every ticket closed there counts double.","New users: Synergy Consultants (always in pairs; close one and the other gets angry), Duplicate Dave (comes back once as Dave (2)) and Badge Brenda (slows you down while she tailgates you).","At 10:00 the Hostile Takeover tours the floor. It absorbs any user it touches to heal and grow, sends Restructuring memos down warned lanes, and spins off a Subsidiary at half HP.","Smash Unclaimed Moving Boxes for a free pickup, and grab the Welcome Swag Bag for sanity and a burst of speed.","Winning maps now unlocks new things. Server Room: five tools, the Network Engineer and The Intern. Call Center: four passives and the Help Desk Manager. Parking Garage: six evolutions and the Cloud Architect. Anything you have already used or hired stays yours.","Rebalance: the Open Office is a little gentler, the Major Incident, Angry Caller and Call Center phones hit softer, and The Executive has 60,000 HP (was 80,000). Every map should now feel about as tough as the gear you have when you get there."]},{id:"2026-10-21-tools",date:"Oct 21, 2026",title:"5 new tools, 4 passives, 6 evolutions",items:["New tools: Reply-All Storm (a ring of emails), Zip Ties (traps that tie users down), Password Expired (users wander off confused), Screen Share (a projector beam the way you face) and Rubber Duck (users it quacks at take extra damage).","New passives: Spare Charger (+1 projectile on your tools), Extended Warranty (survive one burnout), Snack Drawer (sanity regen) and Lucky Lanyard (more drops, rarer cards, bigger chests).","Six tools can now evolve: KB Article into Confluence Space, MFA Prompt into Passwordless, Group Policy Push into Domain Lockdown, Remote Desktop into Remote Wipe, Out-of-Office Reply into Sabbatical and Ping Sweep into SIEM. The Help Desk Wiki says which passive each one needs."]},{id:"2026-10-20-training",date:"Oct 20, 2026",title:"Training Shift",items:['New to the help desk? "Training Shift" on the title screen (T) walks you through moving, closing tickets, levelling up and staying sane, in about two minutes.',"Brand-new players are offered it the first time they clock in. It never costs you anything: no burnout, no pay, no leaderboard.","Level-up cards can now be picked with keys 1 to 4 (the fourth card had no key)."]},{id:"2026-10-20-bugs",date:"Oct 20, 2026",title:"Report a Bug",items:['Found something broken? Tap "Report a Bug" on the title screen, or in the pause menu (B) mid-shift.',"Your report includes the game version and what was happening, so you only need to say what went wrong."]},{id:"2026-10-20-news",date:"Oct 20, 2026",title:"Player profiles and What's new",items:["Tap any name on the leaderboard to see that player's profile: best shifts, favourite technician and achievements. Yours is under Account, My profile.","The version number now shows at the bottom of the title and Settings screens. Testers: mention it when you report a problem.",`This screen! It shows once after each update. Open it again any time from "What's new" next to the version.`]},{id:"2026-10-20-accounts",date:"Oct 20, 2026",title:"Accounts and cloud saves",items:["Posting a score now claims your leaderboard name, so nobody else can post as you.","Sign in with Google (Account, on the title screen) to back up your progress and play on other devices.","If two devices both have progress, you pick which one to keep."]},{id:"2026-10-20-review",date:"Oct 20, 2026",title:"Performance reviews",items:["Every shift now ends with an HR performance review: a rating, three comments from your manager and a goal for next quarter."]},{id:"2026-10-20-wiki",date:"Oct 20, 2026",title:"Help Desk Wiki and a sound overhaul",items:["The Help Desk Wiki (K on the title screen) fills in with every user, boss, tool and passive you meet.","Louder, clearer sound, with stereo, boss warnings and sounds for tools that used to be silent."]},{id:"2026-10-20-balance",date:"Oct 20, 2026",title:"Difficulty pass",items:["Level-ups now offer 4 choices instead of 3.","Weaker tools got stronger, and helpers aim at bosses.","Fixed tickets sometimes vanishing when the floor was full."]}];var Pn="helpdesk-survivors.news.v1";function Zr(){try{return localStorage.getItem(Pn)}catch{return ge[0]?.id}}function Cn(){try{localStorage.setItem(Pn,ge[0]?.id??"")}catch{}}function $n(e){return!ge.length||Zr()===ge[0].id?!1:e.data.shifts?!0:(Cn(),!1)}var In=e=>`<div class="news-entry">
